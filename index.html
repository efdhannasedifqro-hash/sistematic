<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema TIC</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        .login-card h2 { color: #2c3e50; margin-bottom: 5px; }
        .login-card p { color: #7f8c8d; margin-bottom: 30px; font-size: 0.95em; }
        #loader { display: none; color: #00ad9f; font-weight: bold; margin-top: 20px; }
        #error-msg { display: none; color: #e74c3c; background: #fdf0ed; padding: 10px; border-radius: 8px; margin-top: 20px; font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Mesa de Ayuda TIC</h2>
        <p>Inicia sesión con tu correo institucional</p>

        <!-- El Botón Oficial de Google -->
        <div id="g_id_onload"
             data-client_id="295476608605-26sf6c2rofkp0r7hdclb2tte5l1okock.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="manejarRespuestaGoogle"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>

        <div id="loader">Validando credenciales... ⏳</div>
        <div id="error-msg"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxZhLFw530NGYRXyvdJLoMw0Y40VijyHqW0dwnkEv6Id68GiB__W77WEPYoaliusost/exec';

        // 1. Decodificar el Token de Google para extraer el email
        function decodificarJWT(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 2. Función que se ejecuta cuando el usuario le da clic al botón y Google lo aprueba
        async function manejarRespuestaGoogle(response) {
            const payload = decodificarJWT(response.credential);
            const userEmail = payload.email; // Aquí obtenemos su correo de forma segura

            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';

            try {
                // 3. Le preguntamos a nuestra API si ese correo está autorizado en la Hoja 2
                const req = await fetch(`${API_URL}?accion=login_google&email=${encodeURIComponent(userEmail)}`);
                const res = await fetch(req.url); // Truco para evitar bloqueo CORS en peticiones GET
                const data = await res.json();

                if (data.valid) {
                    // Guardamos la sesión exactamente igual que en el login anterior
                    localStorage.setItem('userLogged', 'true');
                    localStorage.setItem('userRole', data.rol);
                    localStorage.setItem('userName', data.nombre);
                    localStorage.setItem('userAccesos', JSON.stringify(data.accesos || []));
                    
                    // Redirigimos según el rol
                    if (data.rol === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = `historial.html?nombre=${encodeURIComponent(data.nombre)}`;
                    }
                } else {
                    mostrarError("Acceso denegado. Este correo no está autorizado en el sistema.");
                }
            } catch (error) {
                mostrarError("Error de conexión con el servidor.");
            }
        }

        function mostrarError(mensaje) {
            document.getElementById('loader').style.display = 'none';
            document.querySelector('.g_id_signin').style.display = 'block';
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = mensaje;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
